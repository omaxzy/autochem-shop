<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Личный кабинет - AutoChem</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: #0f0f0f; color: #ddd; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
        .header h1 { font-size: 1.5rem; font-weight: 800; color: #fff; }
        .header a { color: #ddd; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-left: 1rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #1a1a1a; border-radius: 16px; padding: 1.5rem; border: 1px solid #2a2a2a; margin-bottom: 1.5rem; }
        .card h2 { font-weight: 800; color: #fff; margin-bottom: 1rem; }
        .order { border: 1px solid #2a2a2a; border-radius: 12px; padding: 1rem; margin-bottom: 0.8rem; }
        .order-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .order-status { padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .status-new { background: #3a3a1a; color: #ffc107; } .status-processing { background: #1a2a3a; color: #64b5f6; } .status-done { background: #1a3a1a; color: #81c784; }
        .order-items { font-size: 0.9rem; color: #999; } .order-total
