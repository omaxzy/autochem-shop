<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - AutoChem</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --accent: #e94560; --text: #ddd; --muted: #999; --white: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: var(--surface); border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.5rem; font-weight: 800; } .logo a { color: var(--white); text-decoration: none; } .logo span { color: var(--accent); }
        .header-right { display: flex; gap: 1rem; align-items: center; }
        .header-btn { color: var(--text); text-decoration: none; padding: 0.5rem 1.2rem; border: 1px solid var(--border); border-radius: 30px; font-size: 0.85rem; font-weight: 600; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .back-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 1rem; }
        .cart-container { background: var(--surface); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border); }
        .cart-container h1 { font-weight: 800; color: var(--white); margin-bottom: 1rem; }
        .cart-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border); align-items: center; }
        .cart-item-img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; }
        .cart-item-info { flex: 1; } .cart-item-name { font-weight: 700; color: var(--white); }
        .cart-item-price { color: var(--accent); font-weight: 700; margin-top: 0.2rem; }
        .cart-item-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-weight: 700; }
        .qty-value { font-weight: 700; min-width: 20px; text-align: center; }
        .cart-item-total { font-weight: 700; } .remove-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #c62828; }
        .cart-summary { text-align: right; margin-top: 1.5rem; }
        .cart-total { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
        .btn-checkout { background: var(--accent); color: white; padding: 0.8rem 2rem; border-radius: 30px; text-decoration: none; font-weight: 700; display: inline-block; }
        .cart-empty { text-align: center; padding: 3rem; color: var(--muted); }
    </style>
</head>
<body>
    <header class="header"><div class="logo"><a href="/">AUTO<span>CHEM</span></a></div>
        <div class="header-right">
            {% if session.user_id %}<a href="/account" class="header-btn">{{ session.username }}</a><a href="/logout" class="header-btn">Выйти</a>{% else %}<a href="/login" class="header-btn">Войти</a><a href="/register" class="header-btn">Регистрация</a>{% endif %}
        </div>
    </header>
    <div class="container">
        <a href="/catalog" class="back-link">← В каталог</a>
        <div class="cart-container"><h1>🛒 Корзина</h1>
            <div id="cart-items"><div class="cart-empty">Корзина пуста</div></div>
            <div class="cart-summary" id="cart-summary" style="display:none;"><div class="cart-total">Итого: <span id="cart-total">0</span> ₽</div><a href="/checkout" class="btn-checkout">Оформить заказ</a></div>
        </div>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); renderCart(); }
        function removeFromCart(id) { cart = cart.filter(i => i.id !== id); saveCart(); }
        function changeQty(id, d) { const item = cart.find(i => i.id === id); if (item) { item.qty += d; if (item.qty <= 0) { removeFromCart(id); return; } saveCart(); } }
        function renderCart() { const c = document.getElementById('cart-items'); const s = document.getElementById('cart-summary'); if (cart.length === 0) { c.innerHTML = '<div class="cart-empty">Корзина пуста</div>'; s.style.display = 'none'; return; } s.style.display = 'block'; let total = 0; c.innerHTML = cart.map(i => { const t = i.price * i.qty; total += t; return `<div class="cart-item"><img src="/uploads/${i.image}" class="cart-item-img"><div class="cart-item-info"><div class="cart-item-name">${i.name}</div><div class="cart-item-price">${i.price} ₽ / шт</div><div class="cart-item-controls"><button class="qty-btn" onclick="changeQty(${i.id},-1)">−</button><span class="qty-value">${i.qty}</span><button class="qty-btn" onclick="changeQty(${i.id},1)">+</button></div></div><div class="cart-item-total">${t.toLocaleString()} ₽</div><button class="remove-btn" onclick="removeFromCart(${i.id})">🗑️</button></div>`; }).join(''); document.getElementById('cart-total').textContent = total.toLocaleString(); }
        renderCart();
    </script>
</body>
</html>
