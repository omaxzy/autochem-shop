<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа - AutoChem</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --accent: #e94560; --text: #ddd; --muted: #999; --white: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .container { background: var(--surface); border-radius: 20px; padding: 2rem; max-width: 500px; width: 100%; border: 1px solid var(--border); }
        h1 { font-weight: 800; color: var(--white); text-align: center; margin-bottom: 0.3rem; }
        .subtitle { text-align: center; color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .cart-summary { background: var(--bg); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .cart-summary h3 { font-weight: 700; margin-bottom: 0.5rem; color: var(--white); }
        .cart-summary-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.2rem 0; color: var(--muted); }
        .cart-summary-total { display: flex; justify-content: space-between; font-weight: 800; padding-top: 0.5rem; border-top: 1px solid var(--border); margin-top: 0.3rem; color: var(--white); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text); }
        input, textarea { width: 100%; padding: 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem; font-family: 'Nunito', sans-serif; color: var(--text); }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        .btn-submit { background: var(--accent); color: white; border: none; padding: 0.9rem; border-radius: 30px; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; }
        .back-link { display: block; text-align: center; margin-top: 0.8rem; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Оформление заказа</h1>
        <p class="subtitle">Заполните данные для доставки</p>
        <div class="cart-summary" id="cart-summary">
            <h3>Ваш заказ:</h3>
            <div id="cart-items-list"></div>
            <div class="cart-summary-total"><span>Итого:</span><span id="cart-total">0 ₽</span></div>
        </div>
        <form method="POST" action="/checkout">
            <div class="form-group"><label>Ваше имя *</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Телефон *</label><input type="tel" name="phone" required></div>
            <div class="form-group"><label>Адрес доставки *</label><textarea name="address" required rows="2"></textarea></div>
            <input type="hidden" name="items" id="items-input">
            <input type="hidden" name="total" id="total-input">
            <button type="submit" class="btn-submit">✅ Подтвердить заказ</button>
        </form>
        <a href="/cart" class="back-link">← Вернуться в корзину</a>
    </div>
    <script>
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) window.location.href = '/cart';
        const itemsList = document.getElementById('cart-items-list');
        let total = 0;
        cart.forEach(item => {
            const itemTotal = item.price * item.qty; total += itemTotal;
            itemsList.innerHTML += `<div class="cart-summary-item"><span>${item.name} × ${item.qty}</span><span>${itemTotal.toLocaleString()} ₽</span></div>`;
        });
        document.getElementById('cart-total').textContent = total.toLocaleString() + ' ₽';
        document.getElementById('items-input').value = JSON.stringify(cart);
        document.getElementById('total-input').value = total;
        localStorage.removeItem('cart');
    </script>
</body>
</html>
