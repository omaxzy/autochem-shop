<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - AutoChem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 0.3rem; }
        .logo img { width: 32px; height: 32px; }
        .logo a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: bold; }
        .header-right { display: flex; gap: 0.8rem; align-items: center; }
        .header-btn { color: white; text-decoration: none; padding: 0.4rem 0.8rem; border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; font-size: 0.8rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 15px; padding: 2rem; box-shadow: 0 3px 15px rgba(0,0,0,0.08); }
        .card h1 { font-size: 1.8rem; color: #1a1a2e; margin-bottom: 1.5rem; text-align: center; }
        .contact-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #eee; }
        .contact-item img { width: 32px; height: 32px; }
        .contact-item h3 { font-size: 1rem; color: #1a1a2e; margin-bottom: 0.2rem; }
        .contact-item p { color: #777; font-size: 0.9rem; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #667eea; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="/"><img src="/static/icons/car.png" alt=""></a>
            <a href="/">AutoChem</a>
        </div>
        <div class="header-right">
            {% if session.user_id %}
                <a href="/account" class="header-btn">{{ session.username }}</a>
                <a href="/logout" class="header-btn">Выйти</a>
            {% else %}
                <a href="/login" class="header-btn">Войти</a>
                <a href="/register" class="header-btn">Регистрация</a>
            {% endif %}
        </div>
    </header>

    <div class="container">
        <a href="/" class="back-link">← На главную</a>
        <div class="card">
            <h1>Контакты</h1>
            <div class="contact-item">
                <img src="/static/icons/phone.png" alt="">
                <div><h3>Телефон</h3><p>+7 (999) 123-45-67</p></div>
            </div>
            <div class="contact-item">
                <img src="/static/icons/email.png" alt="">
                <div><h3>Email</h3><p>info@autochem.ru</p></div>
            </div>
            <div class="contact-item">
                <img src="/static/icons/clock.png" alt="">
                <div><h3>Режим работы</h3><p>Ежедневно с 9:00 до 21:00</p></div>
            </div>
            <div class="contact-item">
                <img src="/static/icons/location.png" alt="">
                <div><h3>Адрес</h3><p>г. Ваш город, ул. Примерная, д. 1</p></div>
            </div>
        </div>
    </div>
</body>
</html>
