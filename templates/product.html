<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - AutoChem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; min-height: 100vh; }
        
        .header { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            color: white; padding: 0.8rem 1rem; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 0.3rem; }
        .logo img { width: 32px; height: 32px; }
        .logo a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: bold; }
        .header-right { display: flex; align-items: center; gap: 0.8rem; }
        .header-btn { 
            color: white; text-decoration: none; padding: 0.4rem 0.8rem; 
            border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
            font-size: 0.8rem; display: flex; align-items: center; gap: 0.2rem;
        }
        .header-btn img { width: 16px; height: 16px; }
        .cart-btn { 
            position: relative; background: #e94560; color: white; 
            width: 38px; height: 38px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; text-decoration: none;
        }
        .cart-btn img { width: 22px; height: 22px; }
        .cart-count { 
            position: absolute; top: -5px; right: -5px; 
            background: white; color: #e94560; width: 18px; height: 18px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: bold;
        }
        
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #667eea; text-decoration: none; font-size: 0.85rem; }
        
        .product-detail { 
            background: white; border-radius: 15px; overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08); display: flex; flex-wrap: wrap;
        }
        .product-image-large { 
            width: 100%; max-width: 450px; height: 350px; object-fit: cover; 
        }
        .product-detail-info { flex: 1; padding: 1.5rem; min-width: 280px; }
        .product-detail-name { font-size: 1.5rem; font-weight: bold; color: #1a1a2e; margin-bottom: 0.8rem; }
        .product-detail-meta { display: flex; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .product-detail-meta span { 
            background: #f5f5f5; padding: 0.3rem 0.7rem; border-radius: 15px; 
            font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem;
        }
        .product-detail-meta img { width: 16px; height: 16px; }
        .product-detail-price { font-size: 2rem; font-weight: bold; color: #e94560; margin-bottom: 1rem; }
        .product-detail-description { color: #555; line-height: 1.6; margin-bottom: 1.5rem; }
        
        .btn-buy { 
            background: #e94560; color: white; border: none; 
            padding: 0.8rem 2rem; border-radius: 25px; cursor: pointer; 
            font-size: 1rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .btn-buy img { width: 20px; height: 20px; }
        .btn-buy:hover { background: #c73e56; }
        .btn-buy.added { background: #4CAF50; }

        @media (max-width: 700px) {
            .product-image-large { max-width: 100%; height: 250px; }
            .product-detail-name { font-size: 1.2rem; }
            .product-detail-price { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="/"><img src="/static/icons/car.png" alt=""></a>
            <a href="/">AutoChem</a>
        </div>
        <div class="header-right">
            {% if session.user_id %}
                <a href="/account" class="header-btn"><img src="/static/icons/profile.png" alt=""> {{ session.username }}</a>
                <a href="/logout" class="header-btn">Выйти</a>
            {% else %}
                <a href="/login" class="header-btn"><img src="/static/icons/lock.png" alt=""> Войти</a>
                <a href="/register" class="header-btn"><img src="/static/icons/user.png" alt=""> Регистрация</a>
            {% endif %}
            <a href="/cart" class="cart-btn">
                <img src="/static/icons/cart.png" alt="">
                <span class="cart-count" id="cart-count">0</span>
            </a>
        </div>
    </header>

    <div class="container">
        <a href="/catalog" class="back-link">← В каталог</a>
        
        <div class="product-detail">
            <img src="{{ url_for('uploaded_file', filename=product.image) }}" alt="{{ product.name }}" class="product-image-large">
            <div class="product-detail-info">
                <h1 class="product-detail-name">{{ product.name }}</h1>
                <div class="product-detail-meta">
                    <span><img src="/static/icons/factory.png" alt=""> {{ product.brand }}</span>
                    <span><img src="/static/icons/box.png" alt=""> {{ product.volume }}</span>
                    <span>{{ product.category }}</span>
                </div>
                <div class="product-detail-price">{{ "%.0f"|format(product.price) }} ₽</div>
                <p class="product-detail-description">{{ product.description }}</p>
                <button class="btn-buy" id="buy-btn" onclick="addToCart({{ product.id }}, '{{ product.name|escape }}', {{ product.price }}, '{{ product.image }}')">
                    <img src="/static/icons/cart.png" alt=""> В корзину
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }
        
        function addToCart(id, name, price, image) {
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; }
            else { cart.push({ id, name, price, image, qty: 1 }); }
            saveCart();
            
            const btn = document.getElementById('buy-btn');
            btn.classList.add('added');
            btn.innerHTML = '<img src="/static/icons/check.png" alt=""> Добавлено';
            setTimeout(() => {
                btn.classList.remove('added');
                btn.innerHTML = '<img src="/static/icons/cart.png" alt=""> В корзину';
            }, 1500);
        }
        
        function updateCartUI() {
            document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.qty, 0);
        }
        
        updateCartUI();
    </script>
</body>
</html>
